schema_version: 1

context:
  version: 0.6.2

package:
  name: pysparkling
  version: ${{ version }}

source:
  url: https://github.com/svenkreiss/pysparkling/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 5117d49ef1c8b5561ed9a09da33b1efb6952bf6146d15d7e7d33626bcb2429c4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - python-dateutil >=2.8.0
    - pytz >=2019.3
    - requests >=2.6.0
    - boto >=2.36.0

tests:
  - python:
      imports:
        - pysparkling
        - pysparkling.fileio
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
  - script:
      - pytest -vvv pysparkling/tests
    requirements:
      run:
        - pytest
        - python ${{ python_min }}.*
        - tornado
        - cloudpickle
    files:
      source:
        - LICENSE
        - pysparkling/tests

about:
  summary: Pure Python implementation of the Spark RDD interface.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/svenkreiss/pysparkling

extra:
  recipe-maintainers:
    - cdesouza21
